[project]
name = "blood-donation-platform"
version = "0.1.0"
description = "Unified Blood Donation Day Platform - Arabic RTL web platform for medical blood drives"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Blood Donation Team", email = "dev@blood-donation.local" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "markdown>=3.6",
    "nh3>=0.2.17",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.3",
    "pre-commit>=3.7.1",
    "types-Pillow>=10.2.0.20240520",
    "types-Markdown>=3.6.0.20240316",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------------------------
# Ruff Configuration (Linting and Formatting)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade (Python 3.12+ idioms)
    "N",     # pep8-naming
    "S",     # flake8-bandit (security checks)
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print (prevent print statements)
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # allow asserts in tests
    "S105",   # allow hardcoded dummy passwords/tokens in tests
    "S106",   # allow hardcoded dummy passwords in tests
    "ARG001", # allow unused fixture arguments
    "ARG002", # allow unused method arguments in mock classes
]
"app/cli/*" = [
    "T201",   # allow print in CLI commands
]

# ------------------------------------------------------------------------------
# Mypy Configuration (Type Checking)
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "critical: Critical security or business-rule test (★)",
    "slow: Slow-running tests (concurrency, load, long waits)",
    "br(code): Traces to a specific Business Rule code (e.g. BR-DONOR-09)",
    "unit: Isolated unit tests",
    "db: Database transaction and constraint tests",
    "api: HTTP API contract and status tests",
    "security: Authentication, authorization, and sanitization tests",
    "architecture: Dependency direction and layering tests",
]
addopts = "-ra -q"
